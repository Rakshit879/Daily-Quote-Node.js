<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quote-container">
    <div class="quote-display">
      <div class="quote-text" id="quote">Your quote will appear here...</div>
      <div class="quote-author" id="author">— Author</div>
    </div>
    <button class="generate-btn" id="generate_button">Generate Quote</button>
  </div>
  <script src="getQuote.js"></script>
</body>
</html>
